<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Годы в Хогвартсе</title>
<style>
:root{--bg:#0c0a10;--panel:#16121c;--card:#1e1828;--border:#3d3450;--gold:#c9a227;--gold-b:#e8c547;--text:#eee8f5;--dim:#9a90a8;--hp:#3fb950;--mana:#6c8cff;--stress:#d29922;--xp:#a371f7;--good:#3fb950;--bad:#f85149;--story:#e8c547;--thought:#a5d6ff;--fun:#f0a0d0;--love:#a78bfa;--key:#ff9f43;--prophet:#d9c8a0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.65}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 10%,rgba(156,42,42,.08),transparent 45%),radial-gradient(ellipse at 85% 90%,rgba(124,58,237,.08),transparent 45%);z-index:-1;pointer-events:none}
#app{max-width:920px;margin:0 auto;padding:16px}
.screen{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes glow{0%,100%{box-shadow:0 0 6px rgba(201,162,39,.25)}50%{box-shadow:0 0 14px rgba(201,162,39,.5)}}
@keyframes heart{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.low .bar-fill.hp{animation:pulse 1.2s infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:.94em;border-radius:8px;cursor:pointer;transition:.2s}
.btn:hover:not(:disabled){border-color:var(--gold);background:#252030;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#3d2a10,#5c4018);border-color:var(--gold);color:var(--gold-b);font-weight:600}
.btn.small{padding:5px 10px;font-size:.82em}
.btn.choice{width:100%;text-align:left;justify-content:flex-start;margin-bottom:8px;padding:12px 14px;display:block;line-height:1.5}
.btn.love{border-color:var(--love);color:#e0d5ff}
.btn.love:hover:not(:disabled){background:#2a1f3d;border-color:#c4a5ff}
.btn.key{border-color:var(--key);color:#ffd7a8}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;border-color:#3a2a2a}
.req-hint{display:block;font-size:.78em;color:var(--bad);margin-top:4px;font-style:italic}
.cost-hint{display:block;font-size:.78em;color:var(--stress);margin-top:4px;font-style:italic}
.dev-btn{position:fixed;top:10px;right:10px;z-index:100;background:rgba(30,24,40,.9);border:1px solid var(--border);color:var(--dim);font-size:.75em;padding:4px 10px}
.dev-btn:hover{border-color:var(--gold);color:var(--gold)}
.title-wrap{text-align:center;padding:5vh 16px 36px;max-width:680px;margin:0 auto}
.title-deco{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px auto;width:65%}
.title-main{font-size:clamp(1.7rem,5vw,2.7rem);color:var(--gold-b);font-weight:normal;text-shadow:0 0 24px rgba(201,162,39,.3)}
.title-sub{color:var(--dim);font-style:italic;margin-top:6px}
.title-lore{margin:20px 0;color:var(--dim)}.title-lore p{margin-bottom:10px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.form-label{display:block;color:var(--dim);margin-bottom:6px;font-size:.92em}
input[type=text]{width:100%;max-width:300px;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:1.05em;text-align:center}
input[type=text]:focus{outline:none;border-color:var(--gold)}
.trait-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
@media(max-width:560px){.trait-grid{grid-template-columns:1fr}}
.trait-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;text-align:left;transition:.2s}
.trait-card:hover,.trait-card.selected{border-color:var(--gold);box-shadow:0 0 12px rgba(201,162,39,.2)}
.trait-card h4{color:var(--gold-b);font-weight:normal;margin-bottom:4px}
.trait-card p{font-size:.86em;color:var(--dim)}
.house-pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.78em;margin-left:6px}
.house-Gryffindor{background:rgba(156,42,42,.35);color:#f0a0a0}
.house-Slytherin{background:rgba(26,92,58,.4);color:#90d0b0}
.house-Ravenclaw{background:rgba(30,58,110,.45);color:#a0c0f0}
.house-Hufflepuff{background:rgba(138,107,26,.4);color:#e0d080}
.act-badge{display:inline-block;background:var(--card);border:1px solid var(--gold);color:var(--gold);font-size:.75em;padding:2px 10px;border-radius:12px;margin-bottom:8px}
.game-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.location-name{font-size:1.28em;color:var(--gold-b)}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.85em;color:var(--dim)}
.meta span{background:var(--card);padding:3px 9px;border-radius:14px;border:1px solid var(--border)}
.path-progress{display:flex;align-items:center;gap:2px;margin-bottom:10px;overflow-x:auto;padding:4px 0}
.path-step{flex:1;min-width:42px;text-align:center;font-size:.58em;color:var(--dim)}
.path-step .dot{width:9px;height:9px;border-radius:50%;background:var(--border);margin:0 auto 2px;border:2px solid var(--bg)}
.path-step.done .dot{background:#6a5a30}
.path-step.current .dot{background:var(--gold);animation:glow 2s infinite}
.path-step.current{color:var(--gold-b);font-weight:600}
.path-line{flex:0 0 6px;height:2px;background:var(--border);margin-bottom:12px}
.path-step.done+.path-line{background:#6a5a30}
.status-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.stat-label{display:flex;justify-content:space-between;font-size:.74em;color:var(--dim);margin-bottom:2px}
.bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.bar-fill.hp{background:linear-gradient(90deg,#2ea043,#3fb950)}
.bar-fill.mana{background:linear-gradient(90deg,#3d5fd0,#6c8cff)}
.bar-fill.stress{background:linear-gradient(90deg,#9e6a03,#d29922)}
.bar-fill.xp{background:linear-gradient(90deg,#6e4ec8,#a371f7)}
.bar-fill.elena{background:linear-gradient(90deg,#7c3aed,#c4a5ff)}
.bar-fill.veela{background:linear-gradient(90deg,#ec4899,#f9a8d4)}
.elena-panel{background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(30,24,40,.8));border:1px solid #7c3aed;border-radius:10px;padding:8px 12px;margin:6px 0 10px;display:flex;align-items:center;gap:10px;font-size:.85em}
.elena-panel .bar{flex:1;height:6px}
.elena-panel .heart{color:var(--love);animation:heart 2s infinite}
.veela-panel{background:linear-gradient(135deg,rgba(236,72,153,.12),rgba(30,24,40,.8));border:1px solid #ec4899;border-radius:10px;padding:8px 12px;margin:6px 0 10px;display:flex;align-items:center;gap:10px;font-size:.85em}
.veela-panel .bar{flex:1;height:6px}
.skills-row,.rep-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;font-size:.76em;color:var(--dim)}
.skills-row span,.rep-row span{background:var(--card);padding:2px 8px;border-radius:10px;border:1px solid var(--border)}
.game-main{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:12px}
.description p{margin-bottom:12px;line-height:1.75}
.description p:last-child{margin-bottom:0}
.location-art{text-align:center;font-size:1.45em;color:#6a5a80;margin-bottom:12px;letter-spacing:.1em}
.friends-bar{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:.86em;color:var(--dim)}
.friends-bar strong{color:var(--gold-b);font-weight:normal}
.prophet-panel{background:linear-gradient(135deg,rgba(217,200,160,.08),rgba(30,24,40,.85));border:1px solid #6b5b3a;border-radius:10px;padding:12px 16px;margin-bottom:10px}
.prophet-panel .prophet-title{font-family:'Times New Roman',Georgia,serif;font-size:.72em;color:var(--dim);letter-spacing:.2em;text-transform:uppercase;text-align:center;margin-bottom:4px;border-bottom:1px solid #6b5b3a;padding-bottom:4px}
.prophet-panel .prophet-head{font-family:'Times New Roman',Georgia,serif;color:var(--prophet);font-weight:bold;font-size:.94em;margin-bottom:4px;line-height:1.3;letter-spacing:.02em}
.prophet-panel .prophet-text{font-size:.82em;color:var(--dim);font-style:italic;line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.action-btn{flex:1 1 130px}
.game-bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.game-bottom{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;max-height:300px;overflow-y:auto}
.box-title{font-size:.8em;color:var(--gold);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.inv-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:.9em}
.inv-item:last-child{border-bottom:none}
.log-entry{font-size:.86em;padding:6px 0;border-bottom:1px solid rgba(61,52,80,.45);line-height:1.65}
.log-entry.good{color:var(--good)}.log-entry.bad{color:var(--bad)}.log-entry.story{color:var(--story)}
.log-entry.info{color:var(--dim)}.log-entry.combat{color:#9ab8ff}.log-entry.thought{color:var(--thought);font-style:italic}
.log-entry.fun{color:var(--fun)}.log-entry.love{color:var(--love);font-style:italic}
.log-entry.key{color:var(--key);font-style:italic}
.combat-arena{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:560px){.combat-arena{grid-template-columns:1fr}}
.combatant{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
.combatant.enemy{border-color:#5c2b3a;background:linear-gradient(180deg,#1a1018,#16121c)}
.enemy-art{text-align:center;font-size:2.2em;margin:6px 0}
.scene-wrap{max-width:680px;margin:3vh auto}
.scene-text p{margin-bottom:14px;line-height:1.75}
.end-wrap{max-width:680px;margin:3vh auto;text-align:center}
.end-title{color:var(--gold-b);font-size:1.8em;font-weight:normal}
.end-sub{color:var(--dim);font-style:italic;margin:6px 0 14px}
.end-text p{text-align:left;margin-bottom:10px;line-height:1.7}
.end-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.end-tag{background:var(--card);border:1px solid var(--border);padding:3px 10px;border-radius:14px;font-size:.8em;color:var(--dim)}
.stat-row{display:flex;justify-content:space-between;padding:3px 0;font-size:.9em;border-bottom:1px solid var(--border)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-panel{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:24px;max-width:500px;text-align:center;max-height:85vh;overflow-y:auto}
.modal-panel h3{color:var(--gold-b);font-weight:normal;margin-bottom:12px}
.modal-panel p{color:var(--dim);margin-bottom:16px;font-size:.9em}
.modal-panel .btn{margin:4px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>

  3:{title:'ОКАМЕНЕНИЯ В ХОГВАРТСЕ: ВИНОВАТЫ ЛИ ГНОМЫ?',

     text:'Мальчик-который-выжил утверждает, что Тёмный Лорд вернулся. Министерство опровергает. «Пророк» уточняет: у мальчика шрам. Может, это шрам говорит, а не мальчик. Мальчик не комментирует.'}

/* ===== РАНГИ УРОВНЕЙ ===== */
const RANKS={
  1:'Малыш',
  2:'Робкий Первокурсник',
  3:'Любопытный Второкурсник',
  4:'Начинающий Волшебник',
  5:'Уверенный Ученик',
  6:'Юный Чародей',
  7:'Опытный Волшебник',
  8:'Мастер Заклинаний',
  9:'Старший Маг',
  10:'Мэрлин'
};
function getPlayerRank(level){return RANKS[clamp(level,1,10)]||'Ученик';}

/* ===== СРАЖЕНИЯ ПОСЛЕ 5-Й ЧАСТИ АКТОВ ===== */
const RANDOM_COMBAT_BY_ACT={
  3:['pixie','gnome'],
  4:['spider','dementor'],
  5:['waterTroll','peeves'],
  6:['armor','peacock']
};

/* ===== СОСТОЯНИЕ ===== */
let state=null;
state=newState();

function newState(){
  return{
    screen:'title',player:null,act:1,locationIndex:0,log:[],used:{},flags:{},friends:{},
    rep:{house:0,teachers:0,trouble:0},
    houseRep:{Gryffindor:0,Slytherin:0,Ravenclaw:0,Hufflepuff:0},
    houseCup:{Gryffindor:0,Slytherin:0,Ravenclaw:0,Hufflepuff:0},
    letters:[],
    unreadLetters:0,
    empathyPts:0,
    actionsUsed:0,maxActions:5,
    keyChoices:[],epilogueFlags:{},
    combat:null,scene:null,sceneStep:0,puzzle:null,pendingLevel:false,dayEvents:0,riddle:null,
    elenaTrust:0,romanceChosen:null,datePoints:0,veelaCharm:0,
    prophetAct:1
  };
}

function newPlayer(name,trait){
  return{name:name||'Ученик',trait,house:null,level:1,xp:0,xpNext:20,
    hp:28,maxHp:28,mana:16,maxMana:16,stress:10,
    skills:{charms:1,potions:1,herbology:1,runes:1,stealth:1,empathy:1},
    inventory:{chocolate:1,wiggen:0,scroll:0,canary:0}};
}

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}}
function hasSave(){try{return!!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

function load(){
  try{
    const r=localStorage.getItem(SAVE_KEY);
    if(!r)return false;
    const d=JSON.parse(r);
    if(!d||!d.player)return false;
    state=d;
    if(!state.rep)state.rep={house:0,teachers:0,trouble:0};
    if(!state.houseRep)state.houseRep={Gryffindor:0,Slytherin:0,Ravenclaw:0,Hufflepuff:0};
    if(!state.houseCup)state.houseCup={Gryffindor:0,Slytherin:0,Ravenclaw:0,Hufflepuff:0};
    if(!state.letters)state.letters=[];
    if(state.unreadLetters==null)state.unreadLetters=state.letters.filter(l=>!l.read).length;
    if(state.empathyPts==null)state.empathyPts=0;
    if(state.elenaTrust==null)state.elenaTrust=0;
    if(state.veelaCharm==null)state.veelaCharm=0;
    if(state.actionsUsed==null)state.actionsUsed=0;
    if(state.maxActions==null)state.maxActions=5;
    if(!state.keyChoices)state.keyChoices=[];
    if(!state.epilogueFlags)state.epilogueFlags={};
    if(state.prophetAct==null)state.prophetAct=state.act||1;
    return true;
  }catch(e){return false;}
}

function addLog(t,type='info'){state.log.push({text:t,type});if(state.log.length>140)state.log.shift();}
function addThought(t){state.log.push({text:'💭 '+t,type:'thought'});if(state.log.length>140)state.log.shift();}

function skill(k){return state.player.skills[k]||0;}
function bumpSkill(k,n){state.player.skills[k]=clamp(skill(k)+n,0,5);}

function rel(id,n){state.friends[id]=(state.friends[id]||0)+n;if(state.friends[id]<0)state.friends[id]=0;}
function rep(k,n){
  if(k==='house'&&state.player&&state.player.house){
    changeHouseRep(state.player.house,n);
    state.rep.house=(state.rep.house||0)+n;
  }else{
    state.rep[k]=(state.rep[k]||0)+n;
  }
}
function changeHouseRep(house,n){
  if(!state.houseRep)state.houseRep={Gryffindor:0,Slytherin:0,Ravenclaw:0,Hufflepuff:0};
  state.houseRep[house]=(state.houseRep[house]||0)+n;
}
function relTwins(n){rel('fred',n);rel('george',n);}

function addEmpathy(n=1){
  state.empathyPts=(state.empathyPts||0)+n;
  const thresholds=[1,3,5,8,12,16,20];
  const before=state.empathyPts-n;
  const crossed=thresholds.some(t=>before<t&&state.empathyPts>=t);
  if(crossed){
    bumpSkill('empathy',1);
    addLog('💚 Эмпатия: '+state.empathyPts+' очков. Навык Эмпатии вырос.','good');
  }else{
    addLog('💚 Эмпатия: +'+n+' (всего '+state.empathyPts+').','good');
  }
}
function hasEmpathy(n){return (state.empathyPts||0)>=n;}

function doSort(h){
  state.player.house=h;
  state.flags.sorted=true;
  addLog('«'+HOUSES[h]+'!» Аплодисменты твоего стола. Дом стал частью имени.','story');
  if(h==='Gryffindor')bumpSkill('charms',1);
  if(h==='Ravenclaw')bumpSkill('runes',1);
  if(h==='Slytherin')bumpSkill('stealth',1);
  if(h==='Hufflepuff')bumpSkill('empathy',1);
}

function doLesson(sk){
  const p=state.player;
  const r=roll(20)+skill(sk);
  p.mana=clamp(p.mana-2,0,p.maxMana);
  if(r>=14){bumpSkill(sk,1);p.xp+=10;addLog('Урок '+SKILL_NAMES[sk]+': отлично. +1, +10 XP.','good');rep('teachers',1);}
  else if(r>=8){p.xp+=5;addLog('Урок '+SKILL_NAMES[sk]+': неплохо. +5 XP.','info');}
  else{p.stress=clamp(p.stress+8,0,100);addLog('Урок '+SKILL_NAMES[sk]+': провал и смешки.','bad');}
  checkLevel();
}

function initHouseCup(act){
  const base=HOUSE_CUP_BASE[act]||HOUSE_CUP_BASE[2];
  state.houseCup={...base};
}
function driftHouseCup(){
  if(!state.houseCup||!Object.keys(state.houseCup).length)return;
  if(chance(0.35)){
    const ev=pick(HOUSE_CUP_EVENTS);
    state.houseCup[ev.house]=(state.houseCup[ev.house]||0)+ev.delta;
    addLog('🏆 '+ev.text,'info');
  }
}
function getHouseCupLeader(){
  let best=null,v=-Infinity;
  for(const h of Object.keys(state.houseCup||{})){
    if(state.houseCup[h]>v){v=state.houseCup[h];best=h;}
  }
  return best;
}
function houseCupStandingsText(){
  if(!state.houseCup)return'—';
  const order=['Gryffindor','Slytherin','Ravenclaw','Hufflepuff'];
  return order.map(h=>HOUSES[h]+': '+(state.houseCup[h]||0)).join(' · ');
}

function addLetter(act,from,text){
  const id='l_'+act+'_'+from+'_'+state.letters.length;
  state.letters.push({id,act,from,text,read:false});
  state.unreadLetters=(state.unreadLetters||0)+1;
}
function markLettersRead(){
  (state.letters||[]).forEach(l=>l.read=true);
  state.unreadLetters=0;
}
function generateActLetters(act){
  if(act===1)return;
  const closeFriendIds=Object.keys(state.friends||{}).filter(k=>(state.friends[k]||0)>=2);
  const sent=new Set((state.letters||[]).map(l=>l.from+':'+l.text));
  closeFriendIds.forEach(f=>{
    const pool=LETTER_TEXTS[f];
    if(!pool||!pool.length)return;
    const free=pool.filter(t=>!sent.has(f+':'+t));
    if(!free.length)return;
    const idx=(act-2)%free.length;
    addLetter(act-1,f,free[idx]);
  });
  if((state.elenaTrust||0)>=3&&LETTER_TEXTS.isolde&&closeFriendIds.indexOf('isolde')<0){
    const pool=LETTER_TEXTS.isolde;
    const free=pool.filter(t=>!sent.has('isolde:'+t));
    if(free.length)addLetter(act-1,'isolde',free[(act-2)%free.length]);
  }
  if(state.unreadLetters>0){
    addLog('📬 Пришли письма от близких друзей ('+state.unreadLetters+'). Загляни в «Письма».','story');
  }
}

function addElenaTrust(n){state.elenaTrust=clamp((state.elenaTrust||0)+n,0,15);}

function markKeyChoice(label){
  if(!state.keyChoices)state.keyChoices=[];
  if(!state.keyChoices.includes(label)){
    state.keyChoices.push(label);
    addLog('⭐ Важный выбор: '+label,'key');
  }
}

function hasFriend(){return Object.keys(state.friends||{}).some(k=>state.friends[k]>0);}
function randFriend(){const a=Object.keys(state.friends||{}).filter(k=>state.friends[k]>0);return a.length?pick(a):'jamie';}
function bestFriend(){let b=null,v=-1;for(const k of Object.keys(state.friends||{})){if(state.friends[k]>v){v=state.friends[k];b=k;}}return b||'jamie';}

function startCombat(id){
  const b=ENEMIES[id];if(!b)return;
  const hp=Math.round(b.hp*1.15);
  state.combat={
    enemy:{
      id,name:b.name,desc:b.desc,art:b.art,hp,maxHp:hp,def:b.def,
      dmgMin:Math.max(1,Math.round(b.dmg[0]*1.008)),
      dmgMax:Math.max(2,Math.round(b.dmg[1]*1.008)),
      xp:Math.round(b.xp*1.15)
    },
    log:[],defending:false
  };
  state.screen='combat';
  addClog('Столкновение: '+b.name+'!','combat');
  render();
}
function addClog(t,type='combat'){
  if(!state.combat)return;
  state.combat.log.push({text:t,type});
  if(state.combat.log.length>24)state.combat.log.shift();
}
function cAttack(){
  const c=state.combat,p=state.player;
  if(!c)return;
  if(p.mana<1){addClog('Мало маны.','info');return;}
  p.mana--;
  const r=roll(20);
  if(r<=2){addClog('Промах!','info');}
  else{const d=randInt(4,9)+skill('charms');c.enemy.hp-=d;addClog('Попадание: '+d+'.','good');}
  if(c.enemy.hp<=0){endCombat(true);return;}
  enemyTurn();
}
function cDefend(){
  const c=state.combat;if(!c)return;
  c.defending=true;
  state.player.mana=clamp(state.player.mana+1,0,state.player.maxMana);
  addClog('Защита.','info');
  enemyTurn();
}
function cPotion(){
  const p=state.player;
  if((p.inventory.wiggen||0)>0){p.inventory.wiggen--;p.hp=clamp(p.hp+14,0,p.maxHp);addClog('+14 HP.','good');}
  else if((p.inventory.chocolate||0)>0){p.inventory.chocolate--;p.hp=clamp(p.hp+6,0,p.maxHp);p.mana=clamp(p.mana+4,0,p.maxMana);p.stress=clamp(p.stress-8,0,100);addClog('Шоколад: +6 HP, +4 маны, −8 стресса.','good');}
  else if((p.inventory.canary||0)>0){p.inventory.canary--;addClog('Канареечная галета! Враг в шоке.','fun');state.combat.enemy.hp-=3;}
  else{addClog('Пусто.','info');return;}
  if(state.combat.enemy.hp<=0){endCombat(true);return;}
  enemyTurn();
}
function cFlee(){
  const c=state.combat,p=state.player;if(!c)return;
  const ch=.4+skill('stealth')*.05+(p.trait==='cunning'?.1:0);
  if(Math.random()<ch){addClog('Ушёл(а)!','good');state.combat=null;state.screen='game';render();save();}
  else{addClog('Не вышло!','bad');enemyTurn();}
}
function enemyTurn(){
  const c=state.combat,p=state.player;
  if(!c||c.enemy.hp<=0)return;
  const e=c.enemy;
  const r=roll(20);
  const hitNeed=14+Math.floor(p.level/3);
  if(r+5>=hitNeed){
    let d=randInt(e.dmgMin,e.dmgMax);
    if(c.defending)d=Math.max(1,Math.floor(d/2));
    p.hp-=d;
    addClog(e.name+': '+d+'.','bad');
  }else{addClog(e.name+' мимо.','info');}
  c.defending=false;
  if(p.hp<=0){p.hp=0;endCombat(false);return;}
  render();
}
function endCombat(won){
  const c=state.combat;if(!c)return;
  if(won){
    state.player.xp+=c.enemy.xp;
    addLog('Победа. +'+c.enemy.xp+' XP.','good');
    if(chance(.3)){state.player.inventory.wiggen=(state.player.inventory.wiggen||0)+1;addLog('Зелье в обломках.','good');}
    checkLevel();
  }else{
    state.player.xp=Math.max(0,state.player.xp-6);
    addLog('Падение. −6 XP. Кто-то оттаскивает тебя. Стыд и ушибы.','bad');
    state.player.hp=Math.max(1,Math.floor(state.player.maxHp*.3));
    state.player.stress=clamp(state.player.stress+18,0,100);
  }
  state.combat=null;state.screen='game';render();save();
}

function startScene(id){
  if(!SCENES[id])return;
  state.scene=id;
  state.sceneStep=0;
  state.screen='scene';
  render();
}
function endScene(){
  state.scene=null;
  state.screen='game';
  render();
  save();
}
function advanceScene(idx){
  const sceneBefore=state.scene;
  const screenBefore=state.screen;
  const stepBefore=state.sceneStep;
  const sc=SCENES[sceneBefore];
  if(!sc){state.screen='game';render();return;}
  const step=sc.steps[state.sceneStep];
  const ch=(step&&step.choices)||[];
  const choice=ch[idx];
  if(!choice)return;
  if(choice.req){
    if(choice.req.skill&&skill(choice.req.skill)<choice.req.min)return;
    if(choice.req.empathy&&!hasEmpathy(choice.req.empathy))return;
  }
  choice.run();
  if(state.screen!==screenBefore){save();return;}
  if(state.scene!==sceneBefore){save();return;}
  if(state.sceneStep!==stepBefore){render();save();return;}
  state.sceneStep++;
  if(state.sceneStep>=sc.steps.length){state.scene=null;state.screen='game';}
  render();save();
}

function startRiddle(id){if(!RIDDLES[id])return;state.riddle=id;state.screen='riddle';render();}
function answerRiddle(idx){
  const r=RIDDLES[state.riddle];if(!r)return;
  const p=state.player;
  if(idx===r.correct){p.xp+=6;addLog('Правильно! +6 XP.','good');checkLevel();}
  else{p.xp=Math.max(0,p.xp-3);addLog('Неправильно. −3 XP.','bad');p.stress=clamp(p.stress+2,0,100);}
  state.riddle=null;state.screen='game';render();save();
}

function startPuzzle(id){
  if(!PUZZLES[id])return;
  state.puzzle={id,cluesFound:[],attempts:0,resolved:false,selected:null};
  state.screen='puzzle';
  render();
}
function puzFindClue(clueId){
  if(!state.puzzle)return;
  if(state.puzzle.cluesFound.includes(clueId))return;
  const p=PUZZLES[state.puzzle.id];
  const clue=p.clues.find(c=>c.id===clueId);
  if(!clue)return;
  if(clue.req&&clue.req.skill&&skill(clue.req.skill)<clue.req.min)return;
  state.puzzle.cluesFound.push(clueId);
  addLog('🔍 Улика: '+clue.text,'story');
  save();render();
}
function puzSelect(suspectKey){
  if(!state.puzzle)return;
  state.puzzle.selected=suspectKey;
  save();render();
}
function puzConfirm(){
  if(!state.puzzle||!state.puzzle.selected)return;
  const p=PUZZLES[state.puzzle.id];
  const chosen=p.suspects.find(s=>s.key===state.puzzle.selected);
  if(!chosen)return;
  if(chosen.key===p.solution){
    addLog('✅ Ты нашёл(ла) виновника!','good');
    p.explanation.forEach(line=>addLog(line,'story'));
    state.player.xp+=25;checkLevel();
    state.flags['puzzle_'+state.puzzle.id+'_solved']=true;
    state.flags['puzzle_'+state.puzzle.id+'_solution']=chosen.key;
    state.puzzle.resolved=true;
  }else{
    addLog('❌ Нет. Это не он(а). Ты уверен(а)?','bad');
    state.player.stress=clamp(state.player.stress+5,0,100);
    state.puzzle.attempts++;
    if(state.puzzle.attempts>=3){
      addLog('Ты не смог(ла) разобраться. И это тоже ответ.','info');
      state.flags['puzzle_'+state.puzzle.id+'_failed']=true;
      state.puzzle.resolved=true;
    }
  }
  save();render();
}
function puzClose(){state.puzzle=null;state.screen='game';render();save();}

  ()=>{addLog('Сова от семьи: «Мы тобой гордимся. Ешь горячее, не забывай про сон». Почерк мамин, а в углу папина приписка: «И не лезь в неприятности». Стресс −4.','good');state.player.stress=clamp(state.player.stress-4,0,100);},
  ()=>{addLog('Слух у стола: кто-то снова видел Филча, танцующего с миссис Норрис. Врёт, конечно. Наверное. Стресс +2.','fun');state.player.stress=clamp(state.player.stress+2,0,100);},
  ()=>{addLog('Ты находишь шоколадную лягушку в кармане мантии. Карточка внутри Дамблдор. Ты улыбаешься.','good');state.player.inventory.chocolate=(state.player.inventory.chocolate||0)+1;},
  ()=>{addLog('Пайк смотрит через весь двор. Долго и молча. Ты чувствуешь взгляд спиной. Стресс +4.','bad');state.player.stress=clamp(state.player.stress+4,0,100);},
  ()=>{addLog('Удачный час самоподготовки. Ты сидишь в библиотеке, шепчешь формулы, и внезапно всё складывается. +4 XP.','info');state.player.xp+=4;checkLevel();},
  ()=>{if(state.flags.metTwins){addLog('Где-то взрывается что-то розовое. Фред орёт: «ЭТО БЫЛ ДЖОРДЖ!» Стресс +2.','fun');}else addLog('Где-то взрывается что-то розовое. Учителя бегут. Стресс +2.','fun');state.player.stress=clamp(state.player.stress+2,0,100);},
  ()=>{addLog('Дождь за окнами башни. Хочется домой и никуда не хочется. Оба чувства могут быть правдой. Стресс +2.','thought');state.player.stress=clamp(state.player.stress+2,0,100);},
  ()=>{if(hasFriend()){const f=randFriend();rel(f,1);addLog((FRIEND_NAMES[f]||f)+' делится бутербродом. Мелочь, приятно.','good');}},
  ()=>{addLog('Почти попадаешься Филчу. Сердце стучит. Скрытность проверяется жизнью.','info');if(skill('stealth')<2)state.player.stress=clamp(state.player.stress+7,0,100);},
  ()=>{addLog('На уроке истории магии ты едва не засыпаешь. Храп соседа спасает от позора. Стресс +2.','fun');state.player.stress=clamp(state.player.stress+2,0,100);},
  ()=>{if(chance(.35)){addLog('Внезапная стычка в коридоре!','bad');startCombat(pick(['bully','pixie','gnome']));}},

function maybeDayEvent(){
  if(state.act===1)return;
  if(chance(.45)){state.dayEvents=(state.dayEvents||0)+1;pick(DAY_EVENTS)();}
}

function checkLevel(){
  const p=state.player;
  while(p.xp>=p.xpNext&&p.level<10){
    p.xp-=p.xpNext;p.level++;p.xpNext=Math.round(p.xpNext*1.65);
    p.maxHp+=4;p.hp=Math.min(p.maxHp,p.hp+4);p.maxMana+=2;p.mana=Math.min(p.maxMana,p.mana+2);
    if(chance(.5)){p.inventory.chocolate=(p.inventory.chocolate||0)+2;addLog('Ты находишь в сумке две шоколадные лягушки. Приятный бонус!','good');}
    else{p.inventory.canary=(p.inventory.canary||0)+2;addLog('В кармане две канареечные галеты Уизли. Запас пополнился.','fun');}
    state.pendingLevel=true;
    addLog('Уровень '+p.level+' — '+getPlayerRank(p.level)+'!','story');
  }
}

function applyLevelChoice(c){
  const p=state.player;
  if(c==='hp'){p.maxHp+=3;p.hp+=3;addLog('+3 HP.','good');}
  else if(c==='mana'){p.maxMana+=3;p.mana+=3;addLog('+3 маны.','good');}
  else if(c==='charms'){bumpSkill('charms',1);addLog('+1 Заклинания.','good');}
  else if(c==='stealth'){bumpSkill('stealth',1);addLog('+1 Скрытность.','good');}
  state.pendingLevel=false;render();save();
}

function getLocs(){return state.act===6?LOC_A6:state.act===5?LOC_A5:state.act===4?LOC_A4:state.act===3?LOC_A3:state.act===2?LOC_A2:LOC_A1;}
function getPath(){return PATHS[state.act]||PATHS[1];}

function doLeave(){
  const locs=getLocs();
  const loc=locs[state.locationIndex];
  const prevAct=state.act,prevIdx=state.locationIndex;
  state.flags.leaveBlocked=false;
  if(loc&&loc.onLeave)loc.onLeave();
  if(state.screen==='scene'||state.screen==='combat'||state.screen==='end'||state.screen==='puzzle')return;
  if(state.flags.leaveBlocked){render();save();return;}
  if(state.act!==prevAct){render();save();return;}
  if(state.locationIndex!==prevIdx){render();save();return;}

  const combatKey='combat_act'+state.act+'_done';
  if(state.locationIndex===4&&RANDOM_COMBAT_BY_ACT[state.act]&&!state.flags[combatKey]){
    state.flags[combatKey]=true;
    const enemyId=pick(RANDOM_COMBAT_BY_ACT[state.act]);
    addLog('⚔️ На тебя нападает '+ENEMIES[enemyId].name+'!','bad');
    startCombat(enemyId);
    return;
  }

  if(state.locationIndex>=locs.length-1){
    if(state.act===6){finishGame();return;}
    render();save();return;
  }

  state.locationIndex++;
  state.actionsUsed=0;
  state.player.stress=clamp(state.player.stress+3,0,100);
  if(state.player.stress>70&&chance(.25)){
    state.player.hp=clamp(state.player.hp-2,1,state.player.maxHp);
    addLog('Стресс бьёт по телу.','bad');
  }
  maybeDayEvent();
  driftHouseCup();

  const chaosKey='chaos_act'+state.act+'_shown';
  if(state.locationIndex>=2&&CHAOS_BY_ACT[state.act]&&!state.flags[chaosKey]&&chance(.55)){
    state.flags[chaosKey]=true;
    if(state.screen==='combat')return;
    startChaos(state.act);
    return;
  }

  if(state.screen==='combat')return;
  const next=getLocs()[state.locationIndex];
  addLog('→ '+next.name,'story');
  render();save();
}

function finishGame(){
  state.screen='end';state.combat=null;state.scene=null;state.puzzle=null;
  clearSave();render();
}

  state.act=n;state.locationIndex=0;
  state.used={};state.scene=null;state.combat=null;state.riddle=null;state.puzzle=null;
  state.pendingLevel=false;state.romanceChosen=null;state.datePoints=0;state.veelaCharm=0;
  state.log=[];state.dayEvents=0;
  p.level=n+1;p.xp=0;p.xpNext=20;
  p.maxHp=28+(p.level-1)*4;p.hp=p.maxHp;
  p.maxMana=16+(p.level-1)*2;p.mana=p.maxMana;

  if(n>=2&&n<=6)initHouseCup(n);
  const friendsByAct={
    1:{},2:{},

    4:{martha:2,oliver:2,fred:2,george:2,spike:1},

  state.friends=friendsByAct[n]||{};
  state.letters=[];state.unreadLetters=0;

/* ===== ХЕЛПЕР ДЛЯ СНИТЧА ===== */
function checkSnitch(minute){
  const real=Math.random()<0.25?15:(Math.random()<0.5?25:(Math.random()<0.5?35:45));
  if(minute===real){
    addLog('Ловец ловит снитч на '+real+'-й минуте! Ты угадал(а)! +15 XP.','good');
    state.player.xp+=15;checkLevel();
    state.flags.snitchWon=true;
  }else{
    addLog('Ловец ловит снитч на '+real+'-й минуте. Ты не угадал(а).','info');
    state.player.stress=clamp(state.player.stress+3,0,100);
  }
}

const CHAOS_BY_ACT={
  2:['chaos_a2_1','chaos_a2_2','chaos_a2_3'],
  3:['chaos_a3_1','chaos_a3_2','chaos_a3_3'],
  4:['chaos_a4_1','chaos_a4_2','chaos_a4_3'],
  5:['chaos_a5_1','chaos_a5_2','chaos_a5_3'],
  6:['chaos_a6_1','chaos_a6_2','chaos_a6_3']
};

function startChaos(act){
  const pool=CHAOS_BY_ACT[act];
  if(!pool||!pool.length)return;
  const id=pick(pool);
  addLog('🎲 Приключение: '+SCENES[id].title,'story');
  startScene(id);
}

  html+='<p style="color:var(--text);font-style:italic;margin-bottom:10px">«Шармбаттон приглашает вас на летний лагерь для тех, кто помогал с Турниром…»</p>';

  html+='<div style="color:var(--love);margin-bottom:6px">Отдельный конверт, пахнущий лавандой. Почерк знакомый.</div>';
  html+='<p style="color:var(--text);font-style:italic;margin-bottom:10px">«Привет. Я в Канаде. Здесь горы выше, чем в Шотландии, а небо такое синее, что режет глаза. Мы с мамой ездили к дальним родственникам — не спрашивай, я сама не поняла, кто они.</p>';

  html+='<p style="color:var(--text);font-style:italic">Если ты будешь в Шармбаттоне этим летом — напиши. Или приезжай. — Э.»</p>';

  {id:'oliver_conflict',name:'Оливер и гриффиндорцы',art:'oliver',

      'Оливер смотрит не на обидчиков, а на тебя. В его глазах не страх, а мольба или надежда. Он ждёт, что ты что-то сделаешь. Если ты уйдёшь, он запомнит это навсегда.'

   - rTitle: «И, возможно, первая любовь»

              ранг виден в meta шапки
   - rHeaderButtons: без кнопки «Приключение» (теперь рандом в doLeave)

function rHeaderButtons(){
  const unread=state.unreadLetters||0;
  const badge=unread>0?' <span style="background:var(--bad);color:#fff;border-radius:10px;padding:0 6px;font-size:.75em;margin-left:2px">'+unread+'</span>':'';
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-left:auto">'+
    '<button class="btn small" id="btn-letters" style="border-color:var(--gold)">📬 Письма'+badge+'</button>'+
    '</div>';
}

/* ===== ТИТУЛ ===== */
function rTitle(){
  return '<div class="screen title-wrap"><div class="title-deco"></div>'+
  '<h1 class="title-main">Годы в Хогвартсе</h1>'+
  '<div class="title-sub">Письмо · Первый · Второй · Третий · Четвёртый · Лето в Шармбаттоне</div>'+
  '<div class="title-lore">'+
  '<p>Твоё письмо. Твои друзья. Твои ошибки. Гарри Поттер учится где-то рядом, но это не его история на этих страницах.</p>'+
  '<p>Дуэли, улики, Уизли, Пайк, ночные коридоры, смех, когда страшно. Турнир Трёх Волшебников.</p>'+
  '<p style="color:var(--love)">И, возможно, первая любовь.</p>'+
  '</div><div class="title-deco"></div>'+
  '<div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
  '<button class="btn primary" id="btn-new">Новая игра</button>'+
  (hasSave()?'<button class="btn" id="btn-continue">Продолжить</button>':'')+
  '</div></div>';
}

function bTitle(){
  $('btn-new').onclick=()=>{state=newState();state.screen='char';render();};
  const c=$('btn-continue');
  if(c)c.onclick=()=>{
    if(load()){
      if(state.screen==='end')render();
      else{if(!state.screen||state.screen==='title')state.screen='game';render();}
    }else{
      state=newState();state.screen='char';render();
    }
  };
}

/* ===== СОЗДАНИЕ ПЕРСОНАЖА ===== */
function rChar(){
  const traits=Object.keys(TRAITS).map(k=>'<div class="trait-card" data-trait="'+k+'"><h4>'+TRAITS[k].name+'</h4><p>'+TRAITS[k].desc+'</p></div>').join('');
  return '<div class="screen" style="max-width:640px;margin:3vh auto"><div class="panel">'+
  '<h2 style="color:var(--gold-b);font-weight:normal;text-align:center;margin-bottom:12px">Кто ты?</h2>'+
  '<p style="text-align:center;color:var(--dim);margin-bottom:14px">Имя и характер. Факультет выберет Шляпа, но ты можешь ей подсказать. Дальше выберешь, в чём силён(на), а в чём нет.</p>'+
  '<div style="text-align:center"><label class="form-label" for="nm">Имя</label>'+
  '<input type="text" id="nm" maxlength="18" placeholder="Имя" autofocus></div>'+
  '<div class="trait-grid">'+traits+'</div>'+
  '<div style="text-align:center;margin-top:14px"><button class="btn primary" id="btn-go" disabled>Получить письмо</button></div>'+
  '</div></div>';
}

function bChar(){
  let sel=null;
  document.querySelectorAll('.trait-card').forEach(card=>{
    card.onclick=()=>{
      document.querySelectorAll('.trait-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      sel=card.dataset.trait;
      $('btn-go').disabled=false;
    };
  });
  const go=()=>{
    if(!sel)return;
    const name=(($('nm')||{}).value||'').trim()||'Алекс';
    state.player=newPlayer(name,sel);
    state.screen='recommend';render();
  };
  $('btn-go').onclick=go;
  const inp=$('nm');
  if(inp)inp.onkeydown=e=>{if(e.key==='Enter')go();};
}

function rRecommend(){
  const p=state.player;const recHouse=TRAITS[p.trait].bias;
  return '<div class="screen" style="max-width:560px;margin:3vh auto"><div class="panel">'+
  '<h2 style="color:var(--gold-b);font-weight:normal;text-align:center;margin-bottom:12px">Шляпа задумалась…</h2>'+
  '<p style="text-align:center">'+esc(p.name)+', судя по твоему характеру (<strong>'+TRAITS[p.trait].name+'</strong>), Шляпа, скорее всего, предложит тебе <strong class="house-pill house-'+recHouse+'">'+HOUSES[recHouse]+'</strong>.</p>'+
  '<p style="text-align:center;color:var(--dim);margin-top:12px">Но выбор за тобой. Ты можешь пойти в любой дом.</p>'+
  '<div style="text-align:center;margin-top:16px"><button class="btn primary" id="btn-rec">Понятно</button></div>'+
  '</div></div>';
}

function bRecommend(){$('btn-rec').onclick=()=>{state.screen='focus';render();};}

  const p=state.player;
  const card=(k,attr,desc)=>'<div class="trait-card" data-'+attr+'="'+k+'"><h4>'+SKILL_NAMES[k]+'</h4><p>'+desc+'</p></div>';
  return '<div class="screen" style="max-width:680px;margin:3vh auto"><div class="panel">'+
  '<h2 style="color:var(--gold-b);font-weight:normal;text-align:center;margin-bottom:12px">Склонности к учёбе</h2>'+
  '<p style="text-align:center;color:var(--dim);margin-bottom:14px">'+esc(p.name)+', в чём ты силён(на), а в чём нет? Это повлияет на доступные решения.</p>'+
  '<h3 style="color:var(--gold);margin:14px 0 6px;font-weight:normal">Талант (навык 3)</h3>'+
  '<div class="trait-grid">'+SKILLS.map(k=>card(k,'talent','Сильная сторона')).join('')+'</div>'+

  '</div></div>';

function bFocus(){
  let talent=null,weak=null;
  const btn=$('btn-focus');if(!btn)return;
  const upd=()=>{
    btn.disabled=!(talent&&weak&&talent!==weak);
    btn.textContent=btn.disabled?'Выберите талант и слабость':'Получить письмо';
  };
  document.querySelectorAll('[data-talent]').forEach(el=>{
    el.onclick=()=>{
      document.querySelectorAll('[data-talent]').forEach(e=>e.classList.remove('selected'));
      el.classList.add('selected');
      talent=el.dataset.talent;
      upd();
    };
  });
  document.querySelectorAll('[data-weak]').forEach(el=>{
    el.onclick=()=>{
      document.querySelectorAll('[data-weak]').forEach(e=>e.classList.remove('selected'));
      el.classList.add('selected');
      weak=el.dataset.weak;
      upd();
    };
  });
  btn.onclick=()=>{
    if(!talent||!weak||talent===weak){alert('Выберите разные талант и слабость');return;}
    if(!state.player||!state.player.skills){alert('Ошибка: персонаж не создан');return;}
    state.player.skills[talent]=3;
    state.player.skills[weak]=0;
    state.screen='game';state.act=1;state.locationIndex=0;state.actionsUsed=0;state.log=[];
    addLog(state.player.name+', '+TRAITS[state.player.trait].name.toLowerCase()+'. Сильная сторона '+SKILL_NAMES[talent]+', слабая '+SKILL_NAMES[weak]+'.','story');
    addLog('Обычный день, пока не прилетит сова.','story');
    save();render();
  };
  upd();
}

  '<div><div class="stat-label"><span>✨</span><span>'+p.mana+'/'+p.maxMana+'</span></div><div class="bar"><div class="bar-fill mana" style="width:'+mn+'%"></div></div></div>'+
  '<div><div class="stat-label"><span>😰</span><span>'+st+'</span></div><div class="bar"><div class="bar-fill stress" style="width:'+st+'%"></div></div></div>'+

function rFriends(){

  return html;

function getActions(){
  const loc=getLocs()[state.locationIndex];
  if(!loc)return[];
  const a=[];
  if(state.actionsUsed>=state.maxActions){
    a.push({label:'➡️ '+(loc.leaveLabel||'Дальше')+' (действия исчерпаны)',run:doLeave});
    return a;
  }
  const obs=loc.observations||[];
  const obsKey=loc.id+'_obsCount';
  let obsCount=state.used[obsKey];
  if(typeof obsCount!=='number')obsCount=0;
  if(obs.length&&obsCount<obs.length){
    a.push({label:'🔍 Осмотреться ('+(obsCount+1)+'/'+obs.length+')',run:()=>{
      const idx=Math.min(obsCount,obs.length-1);
      addLog(obs[idx],'info');
      state.used[obsKey]=obsCount+1;
      if(obsCount===0&&!state.used[loc.id+'_firstObsXp']){
        state.player.xp+=3;
        state.used[loc.id+'_firstObsXp']=true;
        checkLevel();
        addLog('+3 XP за первое наблюдение.','good');
      }
      if(loc.hidden&&!state.hiddenFound)state.hiddenFound={};
      if(loc.hidden&&!state.hiddenFound[loc.id]&&chance(.35)){
        state.hiddenFound[loc.id]=true;
        addLog('🔍 Скрытое: '+(loc.hidden.text||'что-то необычное'),'story');
      }
      spendAction();
      render();save();
    }});
  }
  (loc.specials||[]).forEach(s=>{
    const k=loc.id+'_'+s.id;
    if(s.once&&state.used[k])return;
    const isKey=!!s.key;
    const costParts=[];
    if(s.cost){
      if(s.cost.mana)costParts.push('✨'+s.cost.mana);
      if(s.cost.hp)costParts.push('❤️'+s.cost.hp);
      if(s.cost.stress)costParts.push('😰'+s.cost.stress);
    }
    const costHint=costParts.length?'<span class="cost-hint">'+costParts.join(' ')+'</span>':'';
    a.push({label:s.label+(isKey?' ⭐':'')+(costHint||''),run:()=>{
      if(s.cost){
        const p=state.player;
        if(s.cost.mana&&p.mana<s.cost.mana){addLog('Не хватает маны (нужно '+s.cost.mana+').','bad');render();return;}
        if(s.cost.hp&&p.hp<=s.cost.hp){addLog('Слишком мало HP.','bad');render();return;}
        if(s.cost.stress&&p.stress+s.cost.stress>100){addLog('Слишком много стресса.','bad');render();return;}
        if(s.cost.mana)p.mana=clamp(p.mana-s.cost.mana,0,p.maxMana);
        if(s.cost.hp)p.hp=clamp(p.hp-s.cost.hp,1,p.maxHp);
        if(s.cost.stress)p.stress=clamp(p.stress+s.cost.stress,0,100);
      }
      state.used[k]=true;
      if(s.irreversible)state.used[loc.id+'_irrev_'+s.id]=true;
      if(s.key)markKeyChoice(s.label);
      s.run();
      spendAction();
      if(state.screen==='game'){save();render();}
    }});
  });
  a.push({label:'➡️ '+(loc.leaveLabel||'Дальше'),run:doLeave});
  return a;
}

function rGame(){

  }else{

    getActions().map((a,i)=>{

  const invH=inv.length?inv.map(([n,c,k])=>{
    const canUse=(k==='chocolate'||k==='wiggen'||k==='canary');
    return '<div class="inv-item"><span>'+n+'</span><span style="margin-left:auto">×'+c+'</span>'+
    (canUse?'<button class="btn small" data-use="'+k+'">Исп.</button>':'')+'</div>';
  }).join(''):'<span style="color:var(--dim);font-style:italic">Пусто</span>';
  const log=state.log.slice(-18).map(l=>'<div class="log-entry '+l.type+'">'+esc(l.text)+'</div>').join('');
  const house=p.house?'<span class="house-pill house-'+p.house+'">'+HOUSES[p.house]+'</span>':'';
  const actN=state.act===1?'АКТ I. До Хогвартса':(state.act===2?'АКТ II. Первый курс':(state.act===3?'АКТ III. Второй курс':(state.act===4?'АКТ IV. Третий курс':(state.act===5?'АКТ V. Четвёртый курс':'АКТ VI. Лето в Шармбаттоне'))));
  const prophetData=PROPHET[state.prophetAct]||PROPHET[1];
  const prophetHtml='<div class="prophet-panel">'+
    '<div class="prophet-title">Ежедневный Пророк</div>'+
    '<div class="prophet-head">'+esc(prophetData.title)+'</div>'+
    '<div class="prophet-text">'+esc(prophetData.text)+'</div>'+
    '</div>';
  return '<div class="screen"><div class="act-badge">'+actN+'</div>'+rPath()+
  '<header class="game-header" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">'+
  '<div class="location-name">'+loc.name+house+'</div>'+
  '<div class="meta"><span>'+esc(p.name)+'</span><span>'+TRAITS[p.trait].name+'</span><span>🎓 '+getPlayerRank(p.level)+'</span></div>'+
  rHeaderButtons()+
  '</header>'+
  rStatus()+rFriends()+
  '<div class="game-main"><div class="location-art">'+(ART[loc.art]||'✨')+'</div>'+
  '<div class="description">'+loc.desc.map(t=>'<p>'+t+'</p>').join('')+'</div>'+
  '<div class="actions">'+acts+'</div></div>'+
  '<div class="game-bottom"><div class="box"><div class="box-title">Инвентарь (действий: '+actionsLeft+')</div>'+invH+'</div>'+
  '<div class="box log-box"><div class="box-title">Дневник</div>'+log+'</div></div>'+
  prophetHtml+'</div>';
}

function render(){
  const app=$('app');if(!app)return;if(!state)state=newState();
  if(state.player&&!document.getElementById('dev-jump-btn')){
    const btn=document.createElement('button');
    btn.id='dev-jump-btn';btn.className='btn small dev-btn';btn.textContent='⚙ Главы';
    btn.onclick=showDevChapterMenu;
    document.body.appendChild(btn);
  }
  if(state.screen==='game'&&!state.player){state.screen='title';}
  if(state.screen==='title'){app.innerHTML=rTitle();bTitle();}
  else if(state.screen==='char'){app.innerHTML=rChar();bChar();}
  else if(state.screen==='recommend'){app.innerHTML=rRecommend();bRecommend();}
  else if(state.screen==='focus'){app.innerHTML=rFocus();bFocus();}
  else if(state.screen==='game'){app.innerHTML=rGame();bGame();scrollLogs();}
  else if(state.screen==='combat'){app.innerHTML=rCombat();bCombat();scrollLogs();}
  else if(state.screen==='scene'){app.innerHTML=rScene();bScene();}
  else if(state.screen==='riddle'){app.innerHTML=rRiddle();bRiddle();}
  else if(state.screen==='puzzle'){app.innerHTML=rPuzzle();bPuzzle();}
  else if(state.screen==='end'){app.innerHTML=rEnd();bEnd();}
}

function scrollLogs(){
  const l=document.querySelector('.log-box');if(l)l.scrollTop=l.scrollHeight;
  const c=document.querySelector('.combat-log');if(c)c.scrollTop=c.scrollHeight;
}
/* ===== СТАРТ ===== */
state=newState();
render();
</script>
</body>
</html>
